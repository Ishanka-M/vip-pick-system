# Widget internals — dropdowns, date picker, and the st.dataframe canvas — take
# their colours from here, not from CSS. Push this file with the repo, otherwise
# the app falls back to Streamlit's default theme.
[theme]
base                     = "dark"
primaryColor             = "#F0A81C"   # hi-vis amber — primary actions
backgroundColor          = "#0F1720"   # page
secondaryBackgroundColor = "#18222E"   # sidebar, inputs, dataframe surface
textColor                = "#E6EDF5"

[server]
maxUploadSize = 200

[browser]
gatherUsageStats = false
